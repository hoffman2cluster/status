<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Hoffman2 status</title>
  <style>
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: #222; background: #fff; }
    .notice { box-sizing: border-box; width: 100%; max-width: 800px; padding: 24px 28px;
              border-left: 6px solid #2774ae; background: #f3f7fb; }
    h2 { margin: 0 0 10px; font-size: 20px; }
    p { margin: 6px 0; font-size: 15px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="notice">
    <h2>SGE has been retired</h2>
    <p>The Hoffman2 Cluster has migrated from the SGE job scheduler to Slurm.</p>
    <p>The SGE utilization chart is no longer updated. A new utilization chart is forthcoming.</p>
  </div>
</body>
</html>
